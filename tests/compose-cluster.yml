# A 3-node Qdrant cluster whose collections have 3 shards with 3 replicas each.
name: langgraph-store-qdrant-cluster

x-node: &node
  image: qdrant/qdrant:${QDRANT_VERSION:-latest}
  environment:
    QDRANT__CLUSTER__ENABLED: "true"
    QDRANT__STORAGE__COLLECTION__REPLICATION_FACTOR: "3"
    QDRANT__STORAGE__COLLECTION__WRITE_CONSISTENCY_FACTOR: "3"
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333
        && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 && grep -q " 200 " <&3'
    start_period: 5s
    interval: 2s
    timeout: 2s
    retries: 15

services:
  node1:
    <<: *node
    command: ./qdrant --uri http://node1:6335
    ports: ["7001:6333", "7011:6334"]
  node2:
    <<: *node
    command: ./qdrant --bootstrap http://node1:6335 --uri http://node2:6335
    ports: ["7002:6333", "7012:6334"]
    depends_on: {node1: {condition: service_healthy}}
  node3:
    <<: *node
    command: ./qdrant --bootstrap http://node1:6335 --uri http://node3:6335
    ports: ["7003:6333", "7013:6334"]
    depends_on: {node2: {condition: service_healthy}}
