name: langgraph-store-qdrant

services:
  qdrant-test:
    image: qdrant/qdrant:${QDRANT_VERSION:-latest}
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333
          && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 && grep -q " 200 " <&3'
      start_period: 5s
      interval: 2s
      timeout: 2s
      retries: 15
